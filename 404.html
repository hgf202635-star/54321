<!doctype html>
<html lang="ar" dir="rtl">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>جارٍ فتح بوابة العطاء</title></head>
<body><p style="font-family:Tahoma,Arial,sans-serif;text-align:center;margin:4rem auto">جارٍ فتح الصفحة…</p>
<script>
(function () {
  var parts = location.pathname.split('/').filter(Boolean);
  var repo = parts.shift();
  if (!repo) { location.replace('/'); return; }
  var route = '/' + parts.join('/');
  var query = location.search ? '&q=' + encodeURIComponent(location.search.slice(1)) : '';
  location.replace('/' + repo + '/?p=' + encodeURIComponent(route) + query + location.hash);
})();
</script></body></html>
